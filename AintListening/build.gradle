plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'de.switchconsulting.aintlistening'
    compileSdk = 37

    defaultConfig {
        applicationId "de.switchconsulting.aintlistening"
        minSdk 29
        targetSdk = 37
        versionCode 1
        versionName "1.0.0-alpha01"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                    '**/libdjl_tokenizer.so',
                    '**/libggml-base.so',
                    '**/libggml-cpu.so',
                    '**/libggml.so',
                    '**/libomp.so',
                    '**/libwhisper-jni.so',
                    '**/libwhisper.so'
            ]
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["$buildDir/generated/patchedJniLibs"]
        }
    }
}

dependencies {
    implementation ('ai.djl.android:core:0.33.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation ('ai.djl.android:tokenizer-native:0.33.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation ('ai.djl.huggingface:tokenizers:0.37.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'com.github.EberronBruce:WhisperCore_Android:master-SNAPSHOT'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
    implementation 'org.json:json:20260814'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

import de.switchconsulting.patcher.ElfPatcherTask

tasks.register('patchDjlNativeLibs', ElfPatcherTask) {
    outputDir = file("${project.layout.buildDirectory.get().asFile}/generated/patchedJniLibs/arm64-v8a")
    
    def cpName = project.configurations.any { it.name == "debugRuntimeClasspath" } ? "debugRuntimeClasspath" : "runtimeClasspath"
    classpathFiles = project.configurations.named(cpName).map { it.incoming.files }
    runtimeConfiguration = project.configurations.named(cpName)
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
        task.dependsOn "patchDjlNativeLibs"
    }
}



