plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'de.switchconsulting.aintlistening'
    compileSdk = 37

    defaultConfig {
        applicationId "de.switchconsulting.aintlistening"
        minSdk 26
        targetSdk = 37
        versionCode 1
        versionName "1.0.0-alpha01"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["$buildDir/generated/patchedJniLibs"]
        }
    }
}

dependencies {
    implementation ('ai.djl.android:core:0.33.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation ('ai.djl.android:tokenizer-native:0.33.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation ('ai.djl.huggingface:tokenizers:0.37.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'com.alphacephei:vosk-android:0.3.75'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
    implementation 'org.json:json:20260814'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

import java.io.RandomAccessFile
import java.nio.file.Files
import java.nio.file.StandardCopyOption

tasks.register('patchDjlNativeLibs') {
    def outputDir = file("${project.layout.buildDirectory.get().asFile}/generated/patchedJniLibs/arm64-v8a")
    outputs.dir(outputDir)
    
    inputs.files(project.files({
        def cpName = project.configurations.any { it.name == "debugRuntimeClasspath" } ? "debugRuntimeClasspath" : "runtimeClasspath"
        return project.configurations.named(cpName).map { it.incoming.files }
    }))

    doLast {
        if (!outputDir.exists()) {
            outputDir.mkdirs()
        }
        
        def cpName = project.configurations.any { it.name == "debugRuntimeClasspath" } ? "debugRuntimeClasspath" : "runtimeClasspath"
        def classpath = project.configurations.named(cpName).get()
        classpath.incoming.artifacts.artifacts.each { artifact ->
            if (artifact.id.componentIdentifier.hasProperty('group') && artifact.id.componentIdentifier.group == 'ai.djl.android') {
                def jarFile = artifact.file
                if (jarFile.exists()) {
                    zipTree(jarFile).each { file ->
                        if (file.name.endsWith('.so') && file.path.contains('arm64-v8a')) {
                            def destFile = new File(outputDir, file.name)
                            Files.copy(file.toPath(), destFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                            patchElf64File(destFile)
                        }
                    }
                }
            } else if (artifact.id.componentIdentifier.toString().contains('ai.djl.android')) {
                def jarFile = artifact.file
                if (jarFile.exists() && jarFile.name.endsWith('.jar')) {
                    zipTree(jarFile).each { file ->
                        if (file.name.endsWith('.so') && file.path.contains('arm64-v8a')) {
                            def destFile = new File(outputDir, file.name)
                            Files.copy(file.toPath(), destFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                            patchElf64File(destFile)
                        }
                    }
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
        task.dependsOn "patchDjlNativeLibs"
    }
}

static void patchElf64File(File file) {
    RandomAccessFile raf = new RandomAccessFile(file, "rw")
    try {
        if (raf.length() < 64) return
        
        byte[] magic = new byte[4]
        raf.readFully(magic)
        if ((magic[0] & 0xFF) != 0x7F || (magic[1] & 0xFF) != (int)'E' || (magic[2] & 0xFF) != (int)'L' || (magic[3] & 0xFF) != (int)'F') {
            return
        }
        
        int elfClass = raf.read()
        int elfData = raf.read()
        if (elfClass != 2) {
            return
        }
        
        boolean isLittleEndian = (elfData == 1)
        
        raf.seek(32)
        long phoff = readLongElf(raf, isLittleEndian)
        
        raf.seek(54)
        int phentsize = readShortElf(raf, isLittleEndian)
        int phnum = readShortElf(raf, isLittleEndian)
        
        for (int i = 0; i < phnum; i++) {
            long offset = phoff + (i * phentsize)
            raf.seek(offset)
            
            int p_type = readIntElf(raf, isLittleEndian)
            if (p_type == 1) {
                raf.seek(offset + 48)
                long p_align = readLongElf(raf, isLittleEndian)
                
                if (p_align < 16384) {
                    raf.seek(offset + 48)
                    writeLongElf(raf, 16384L, isLittleEndian)
                }
            }
        }
    } finally {
        raf.close()
    }
}

static long readLongElf(RandomAccessFile raf, boolean isLittleEndian) {
    byte[] b = new byte[8]
    raf.readFully(b)
    if (isLittleEndian) {
        return ((b[7] & 0xFFL) << 56) |
               ((b[6] & 0xFFL) << 48) |
               ((b[5] & 0xFFL) << 40) |
               ((b[4] & 0xFFL) << 32) |
               ((b[3] & 0xFFL) << 24) |
               ((b[2] & 0xFFL) << 16) |
               ((b[1] & 0xFFL) << 8)  |
               (b[0] & 0xFFL)
    } else {
        return ((b[0] & 0xFFL) << 56) |
               ((b[1] & 0xFFL) << 48) |
               ((b[2] & 0xFFL) << 40) |
               ((b[3] & 0xFFL) << 32) |
               ((b[4] & 0xFFL) << 24) |
               ((b[5] & 0xFFL) << 16) |
               ((b[6] & 0xFFL) << 8)  |
               (b[7] & 0xFFL)
    }
}

static int readIntElf(RandomAccessFile raf, boolean isLittleEndian) {
    byte[] b = new byte[4]
    raf.readFully(b)
    if (isLittleEndian) {
        return ((b[3] & 0xFF) << 24) |
               ((b[2] & 0xFF) << 16) |
               ((b[1] & 0xFF) << 8)  |
               (b[0] & 0xFF)
    } else {
        return ((b[0] & 0xFF) << 24) |
               ((b[1] & 0xFF) << 16) |
               ((b[2] & 0xFF) << 8)  |
               (b[3] & 0xFF)
    }
}

static int readShortElf(RandomAccessFile raf, boolean isLittleEndian) {
    byte[] b = new byte[2]
    raf.readFully(b)
    if (isLittleEndian) {
        return ((b[1] & 0xFF) << 8) | (b[0] & 0xFF)
    } else {
        return ((b[0] & 0xFF) << 8) | (b[1] & 0xFF)
    }
}

static void writeLongElf(RandomAccessFile raf, long v, boolean isLittleEndian) {
    byte[] b = new byte[8]
    if (isLittleEndian) {
        b[0] = (byte)(v & 0xFF)
        b[1] = (byte)((v >> 8) & 0xFF)
        b[2] = (byte)((v >> 16) & 0xFF)
        b[3] = (byte)((v >> 24) & 0xFF)
        b[4] = (byte)((v >> 32) & 0xFF)
        b[5] = (byte)((v >> 40) & 0xFF)
        b[6] = (byte)((v >> 48) & 0xFF)
        b[7] = (byte)((v >> 56) & 0xFF)
    } else {
        b[0] = (byte)((v >> 56) & 0xFF)
        b[1] = (byte)((v >> 48) & 0xFF)
        b[2] = (byte)((v >> 40) & 0xFF)
        b[3] = (byte)((v >> 32) & 0xFF)
        b[4] = (byte)((v >> 24) & 0xFF)
        b[5] = (byte)((v >> 16) & 0xFF)
        b[6] = (byte)((v >> 8) & 0xFF)
        b[7] = (byte)(v & 0xFF)
    }
    raf.write(b)
}


